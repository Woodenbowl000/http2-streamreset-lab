handlers = 1catalina.org.apache.juli.AsyncFileHandler, java.util.logging.ConsoleHandler

.handlers = 1catalina.org.apache.juli.AsyncFileHandler, java.util.logging.ConsoleHandler

############################################################
# Handler specific properties.
############################################################

1catalina.org.apache.juli.AsyncFileHandler.level = ALL
1catalina.org.apache.juli.AsyncFileHandler.directory = /usr/local/tomcat/logs
1catalina.org.apache.juli.AsyncFileHandler.prefix = catalina.
1catalina.org.apache.juli.AsyncFileHandler.encoding = UTF-8

java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.encoding = UTF-8

############################################################
# HTTP/2 debug logging — the proposal's Week-1 primary signal source.
# This surfaces stream state transitions and RST_STREAM (reset) events,
# which the metrics exporter parses to count client- and server-initiated
# resets without any code change to Tomcat itself.
############################################################
# Keep the HTTP/2 parent logger quiet (avoids the very high-volume Hpack/frame
# debug lines), and turn on verbose logging ONLY for the two loggers the
# victim-exporter parses: the stream state machine (OPEN / HALF_CLOSED_REMOTE /
# CLOSED_RST_TX / CLOSED_RST_RX transitions) and Stream (recycle = backend done).
org.apache.coyote.http2.level = INFO
org.apache.coyote.http2.handlers = 1catalina.org.apache.juli.AsyncFileHandler
org.apache.coyote.http2.StreamStateMachine.level = ALL
org.apache.coyote.http2.Stream.level = ALL

# Keep the rest of the server at a normal level to avoid log noise.
org.apache.catalina.level = INFO
org.apache.coyote.http11.level = INFO
